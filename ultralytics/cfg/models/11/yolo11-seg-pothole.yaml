# YOLO11-seg-pothole: Custom model for pothole detection with segmentation
# Features:
#   - Dynamic Snake Convolution (DSConv) for irregular boundary detection
#   - Simple Attention Module (SimAM) for enhanced feature focus
#   - GELU activation for stable training
#
# Model designed specifically for detecting potholes with irregular/curved edges

# Parameters
nc: 1  # number of classes (pothole only)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # YOLO11n-seg-pothole
  s: [0.50, 0.50, 1024]  # YOLO11s-seg-pothole (recommended)
  m: [0.50, 1.00, 512]   # YOLO11m-seg-pothole
  l: [1.00, 1.00, 512]   # YOLO11l-seg-pothole
  x: [1.00, 1.50, 512]   # YOLO11x-seg-pothole

# Activation: GELU is used in custom modules (DSConv, C3k2_DSConv, etc.)

# YOLO11-pothole backbone with DSConv and SimAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvGELU, [64, 3, 2]]           # 0-P1/2 - First conv with GELU
  - [-1, 1, ConvGELU, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2_DSConv, [256, False, 0.25]]  # 2 - DSConv for irregular features
  - [-1, 1, ConvGELU, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2_DSConv, [512, False, 0.25]]  # 4 - DSConv for irregular features
  - [-1, 1, ConvGELU, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2_DSConv_SimAM, [512, True]]   # 6 - DSConv + SimAM attention
  - [-1, 1, ConvGELU, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2_DSConv_SimAM, [1024, True]]  # 8 - DSConv + SimAM attention
  - [-1, 1, SPPF_SimAM, [1024, 5]]          # 9 - SPPF with SimAM attention
  - [-1, 2, C2PSA, [1024]]                   # 10 - Keep C2PSA for position encoding

# YOLO11-pothole head with enhanced attention
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, C3k2_SimAM, [512, False]]       # 13 - SimAM for attention
  - [-1, 1, SimAM, []]                      # 14 - Additional SimAM

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, C3k2_SimAM, [256, False]]       # 17 (P3/8-small) - SimAM for attention
  - [-1, 1, SimAM, []]                      # 18 - Additional SimAM

  - [-1, 1, ConvGELU, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]              # cat head P4
  - [-1, 2, C3k2_DSConv_SimAM, [512, False]] # 21 (P4/16-medium) - DSConv + SimAM
  - [-1, 1, SimAM, []]                      # 22 - Additional SimAM

  - [-1, 1, ConvGELU, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]              # cat head P5
  - [-1, 2, C3k2_DSConv_SimAM, [1024, True]] # 25 (P5/32-large) - DSConv + SimAM
  - [-1, 1, SimAM, []]                      # 26 - Additional SimAM

  - [[17, 21, 25], 1, Segment, [nc, 32, 256]] # Detect(P3, P4, P5) for segmentation

